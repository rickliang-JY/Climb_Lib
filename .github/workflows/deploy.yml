name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The lockfile was generated behind a private registry mirror, so its
      # `resolved` URLs point at a host that does not exist on CI.
      - name: Install dependencies
        run: npm ci --replace-registry-host=always

      - name: Build
        # Project sites live at /<repo>/, which must be baked into the bundle.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no SPA rewrite rule: it serves 404.html for any path
      # it cannot find on disk. Shipping index.html under that name makes deep
      # links like /history boot the app instead of showing GitHub's 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
